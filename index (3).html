<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Xác thực 2 lớp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* ===================== MÀU SẮC GỐC (tông mint dịu mắt) ===================== */
  :root{
    --bg-1:#eef8f1;
    --bg-2:#dbf0e3;
    --bg-3:#cceadd;
    --surface:#ffffff;
    --surface-2:#f4fbf6;
    --border:rgba(18,90,60,.15);
    --border-strong:rgba(18,90,60,.26);
    --text:#12352a;
    --text-soft:#4c6d5f;
    --text-mute:#7d968a;
    --accent:#1f9d63;
    --accent-2:#0f7a57;
    --accent-soft:rgba(31,157,99,.12);
    --danger:#c2413c;
    --danger-soft:rgba(194,65,60,.1);
    --shadow:0 20px 45px -24px rgba(16,74,52,.4);
    --ring:rgba(31,157,99,.32);

    /* biến màu "chủ đề" dùng riêng cho từng người / từng trường hợp,
       JS sẽ ghi đè các biến này khi hiển thị kết quả */
    --theme:#1f9d63;
    --theme-2:#0f7a57;
    --theme-soft:rgba(31,157,99,.12);

    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg-1:#0a1a14; --bg-2:#0e2419; --bg-3:#102b20;
      --surface:#14291f; --surface-2:#1a3428;
      --border:rgba(140,220,180,.16); --border-strong:rgba(140,220,180,.3);
      --text:#e8f6ee; --text-soft:#b3cfc1; --text-mute:#8aa79a;
      --accent:#38c88a; --accent-2:#5fd8a3; --accent-soft:rgba(56,200,138,.16);
      --danger:#ff8b85; --danger-soft:rgba(255,139,133,.13);
      --shadow:0 20px 45px -24px rgba(0,0,0,.65);
      --ring:rgba(56,200,138,.38);
    }
  }
  :root[data-theme="dark"]{
    --bg-1:#0a1a14; --bg-2:#0e2419; --bg-3:#102b20;
    --surface:#14291f; --surface-2:#1a3428;
    --border:rgba(140,220,180,.16); --border-strong:rgba(140,220,180,.3);
    --text:#e8f6ee; --text-soft:#b3cfc1; --text-mute:#8aa79a;
    --accent:#38c88a; --accent-2:#5fd8a3; --accent-soft:rgba(56,200,138,.16);
    --danger:#ff8b85; --danger-soft:rgba(255,139,133,.13);
    --shadow:0 20px 45px -24px rgba(0,0,0,.65);
    --ring:rgba(56,200,138,.38);
  }

  *,*::before,*::after{box-sizing:border-box;}
  html{height:100%; scroll-padding-top:env(safe-area-inset-top,0px);}
  body{
    margin:0; min-height:100%;
    display:flex; align-items:center; justify-content:center;
    padding:24px;
    font-family:'Be Vietnam Pro', ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height:1.6; color:var(--text);
    background:
      radial-gradient(1000px 600px at 10% -10%, var(--bg-3), transparent 60%),
      radial-gradient(850px 520px at 92% 5%, var(--bg-2), transparent 62%),
      var(--bg-1);
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--accent-soft);}

  .card{
    width:100%; max-width:440px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:22px;
    box-shadow:var(--shadow);
    padding:34px 30px 28px;
    transition:border-color .25s ease, max-width .3s ease;
  }
  .card.wide{max-width:480px; padding:0; overflow:hidden;}

  /* chỉ báo bước */
  .steps{display:flex; align-items:center; gap:8px; margin-bottom:22px;}
  .dot{
    width:26px; height:26px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:.78rem; font-weight:600;
    background:var(--surface-2); color:var(--text-mute);
    border:1px solid var(--border);
  }
  .dot.active{background:var(--accent-soft); color:var(--accent-2); border-color:var(--border-strong);}
  .dot.done{background:var(--accent); color:#fff; border-color:transparent;}
  .line{flex:0 0 26px; height:1px; background:var(--border-strong);}
  .step-name{margin-left:4px; font-size:.82rem; color:var(--text-mute);}

  h1{font-size:1.45rem; font-weight:700; letter-spacing:-.02em; margin:0 0 26px; line-height:1.3;}

  label{display:block; font-size:.87rem; font-weight:500; color:var(--text-soft); margin-bottom:8px;}
  input{
    width:100%; font:inherit; font-size:1.05rem; letter-spacing:.14em;
    padding:14px 16px; color:var(--text);
    background:var(--surface-2);
    border:1px solid var(--border-strong); border-radius:14px;
    outline:none; transition:border-color .2s, box-shadow .2s, background .2s;
  }
  input::placeholder{letter-spacing:.06em; color:var(--text-mute);}
  input:focus{border-color:var(--accent); background:var(--surface); box-shadow:0 0 0 4px var(--ring);}

  label.field-2{margin-top:18px;}
  select{
    width:100%; font:inherit; font-size:.97rem; letter-spacing:0;
    padding:13px 40px 13px 16px; color:var(--text);
    background:var(--surface-2);
    border:1px solid var(--border-strong); border-radius:14px;
    outline:none; cursor:pointer; appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='18' height='18' viewBox='0 0 24 24' fill='none' stroke='%234c6d5f' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='m6 9 6 6 6-6'/></svg>");
    background-repeat:no-repeat;
    background-position:right 14px center;
    transition:border-color .2s, box-shadow .2s, background-color .2s;
  }
  select:focus{border-color:var(--accent); background-color:var(--surface); box-shadow:0 0 0 4px var(--ring);}
  select:invalid{color:var(--text-mute);}
  select option{color:var(--text);}

  .msg{
    display:none; align-items:flex-start; gap:8px;
    font-size:.85rem; color:var(--danger); background:var(--danger-soft);
    border-radius:12px; padding:10px 12px; margin-top:14px;
  }
  .msg.show{display:flex;}
  .msg svg{flex:0 0 auto; margin-top:3px;}

  .btn{
    width:100%; margin-top:18px;
    display:flex; align-items:center; justify-content:center; gap:9px;
    font:inherit; font-weight:600; font-size:.97rem;
    padding:14px 20px; border:0; border-radius:14px; cursor:pointer;
    color:#fff; background:var(--accent-2);
    transition:background .2s, transform .12s;
  }
  .btn:hover{background:var(--accent);}
  .btn:active{transform:scale(.985);}
  .btn.ghost{
    background:transparent; color:var(--text-soft);
    border:1px solid var(--border-strong); margin-top:12px;
  }
  .btn.ghost:hover{color:var(--accent-2); background:var(--accent-soft); border-color:var(--border-strong);}
  .btn:focus-visible, input:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}

  .hidden{display:none !important;}

  @keyframes shake{
    0%,100%{transform:translateX(0);}
    20%,60%{transform:translateX(-7px);}
    40%,80%{transform:translateX(7px);}
  }
  .shake{animation:shake .38s cubic-bezier(.36,.07,.19,.97) both;}

  /* ===================== KHUNG KẾT QUẢ: NGƯỜI CÓ TRONG DANH SÁCH ===================== */
  #resultValid .rv-photo-wrap{
    position:relative; width:100%; aspect-ratio:4/3;
    background:var(--theme-soft);
    overflow:hidden;
  }
  #resultValid .rv-photo-wrap img{
    width:100%; height:100%; object-fit:cover; display:block;
  }
  #resultValid .rv-photo-wrap::after{
    content:''; position:absolute; inset:0;
    background:linear-gradient(180deg, transparent 55%, rgba(0,0,0,.42) 100%);
  }
  #resultValid .rv-name{
    position:absolute; left:22px; bottom:16px; z-index:2;
    color:#fff; font-size:1.35rem; font-weight:700; letter-spacing:-.02em;
    text-shadow:0 2px 10px rgba(0,0,0,.35);
  }
  #resultValid .rv-badge{
    position:absolute; top:16px; left:16px; z-index:2;
    display:inline-flex; align-items:center; gap:6px;
    font-size:.72rem; font-weight:600; color:#fff;
    background:var(--theme); border-radius:999px; padding:5px 11px;
    box-shadow:0 6px 16px -4px rgba(0,0,0,.35);
  }
  #resultValid .rv-body{padding:24px 26px 26px;}
  #resultValid .rv-body p{margin:0 0 12px; color:var(--text-soft); font-size:.97rem;}
  #resultValid .rv-body p:last-of-type{margin-bottom:0;}
  #resultValid .rv-inline-img{
    display:block; width:100%; max-width:280px; margin:6px auto 16px;
    border-radius:14px; box-shadow:var(--shadow);
  }
  #resultValid .rv-divider{
    width:36px; height:3px; border-radius:3px; background:var(--theme); margin:0 0 14px;
  }
  #resultValid .btn{margin:22px 26px 0; width:calc(100% - 52px);}
  #resultValid .btn.ghost{margin-top:10px; margin-bottom:24px;}

  /* kiểu "don": chỉ ảnh + nội dung, không huy hiệu, không tên đè lên ảnh */
  #resultValid.kieu-don .rv-photo-wrap{display:none;}
  #resultValid.kieu-don .rv-photos-grid{
    display:none;
    grid-template-columns:repeat(auto-fit, minmax(150px,1fr));
    gap:10px;
    padding:22px 22px 0;
  }
  #resultValid.kieu-don .rv-photos-grid{display:grid;}
  #resultValid.kieu-don .rv-photos-grid img{
    width:100%; aspect-ratio:1/1; object-fit:cover;
    border-radius:16px; display:block;
    box-shadow:var(--shadow);
  }
  #resultValid .rv-photos-grid{display:none;}

  /* ===================== KHUNG KẾT QUẢ: KHÔNG CÓ TRONG DANH SÁCH ===================== */
  #resultInvalid{
    padding:30px 26px 26px; text-align:center;
  }
  #resultInvalid .ri-tag{
    display:inline-flex; align-items:center; gap:6px;
    font-size:.72rem; font-weight:700; letter-spacing:.02em;
    color:var(--danger); background:var(--danger-soft);
    border-radius:999px; padding:5px 12px; margin-bottom:16px;
  }
  #resultInvalid h1{
    font-size:1.5rem; font-weight:800; color:var(--danger);
    letter-spacing:-.01em; margin:0 0 20px; line-height:1.35;
  }
  #resultInvalid .ri-photo{
    width:100%; max-width:260px; margin:0 auto 22px;
    border-radius:20px; overflow:hidden;
    border:1px solid var(--border-strong);
    box-shadow:var(--shadow);
    transform:rotate(-1.5deg);
  }
  #resultInvalid .ri-photo img{width:100%; display:block;}
  #resultInvalid .btn.ghost{margin-top:6px;}

  @media (max-width:520px){
    body{padding:18px;}
    .card{padding:28px 22px 24px; border-radius:20px;}
    .card.wide{padding:0;}
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.01ms !important; transition-duration:.01ms !important;}
  }
</style>
</head>
<body>

<div class="card" id="card">

  <!-- ===================== LỚP 1: MẬT KHẨU CHUNG ===================== -->
  <section id="step1">
    <div class="steps">
      <span class="dot active">1</span><span class="line"></span><span class="dot">2</span>
      <span class="step-name">Bước 1 / 2</span>
    </div>

    <h1>Trang web được bảo vệ</h1>

    <form id="form1" novalidate>
      <label for="pass1">Mật khẩu có 8 số là ngày sinh của Thành Ng</label>
      <input id="pass1" type="text" inputmode="numeric" maxlength="8"
             placeholder="8 chữ số" autocomplete="off" required>

      <div class="msg" id="err1" role="alert">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="9"></circle><path d="M12 7.5v5.5"></path><path d="M12 16.5h.01"></path>
        </svg>
        <span id="err1Text"></span>
      </div>

      <button class="btn" type="submit">Tiếp tục</button>
    </form>
  </section>

  <!-- ===================== LỚP 2: NGÀY SINH NGƯỜI DÙNG ===================== -->
  <section id="step2" class="hidden">
    <div class="steps">
      <span class="dot done">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m5 12.5 4.5 4.5L19 7.5"></path>
        </svg>
      </span>
      <span class="line"></span><span class="dot active">2</span>
      <span class="step-name">Bước 2 / 2</span>
    </div>

    <h1>Xác thực danh tính</h1>

    <form id="form2" novalidate>
      <label for="pass2">Nhập ngày sinh của bạn (8 chữ số, định dạng DDMMYYYY):</label>
      <input id="pass2" type="text" inputmode="numeric" maxlength="8"
             placeholder="VD: 01012000" autocomplete="off" required>

      <label for="truong" class="field-2">Bạn học trường nào?</label>
      <select id="truong" required>
        <option value="" disabled selected>-- Chọn trường --</option>
        <option value="UET">UET</option>
        <option value="ULIS">ULIS</option>
        <option value="UMP">UMP</option>
        <option value="UED">UED</option>
        <option value="UEB">UEB</option>
        <option value="SIS">SIS</option>
        <option value="HUS">HUS</option>
        <option value="USSH">USSH</option>
        <option value="HNUE">HNUE</option>
        <option value="AJC">AJC</option>
        <option value="FTU">FTU</option>
        <option value="DAV">DAV</option>
        <option value="HUST">HUST</option>
        <option value="NEU">NEU</option>
        <option value="HUCE">HUCE</option>
        <option value="UTC">UTC</option>
        <option value="UTT">UTT</option>
        <option value="HAUI">HAUI</option>
        <option value="TMU">TMU</option>
        <option value="HCMUS">HCMUS</option>
        <option value="HMU">HMU</option>
        <option value="HANU">HANU</option>
        <option value="UL">UL</option>
        <option value="BAV">BAV</option>
        <option value="VNUA">VNUA</option>
        <option value="PTIT">PTIT</option>
        <option value="KHAC">Trường Đại Học Khác</option>
      </select>

      <div class="msg" id="err2" role="alert">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="9"></circle><path d="M12 7.5v5.5"></path><path d="M12 16.5h.01"></path>
        </svg>
        <span id="err2Text"></span>
      </div>

      <button class="btn" type="submit">Mở nội dung</button>
      <button class="btn ghost" type="button" id="backBtn">Quay lại bước 1</button>
    </form>
  </section>

  <!-- ===================== KẾT QUẢ A: NGƯỜI CÓ TRONG DANH SÁCH ===================== -->
  <!-- Mỗi người một "kiểu" khác nhau: ảnh, tên, màu chủ đề, nội dung đều đổi qua JS -->
  <section id="resultValid" class="hidden">
    <div class="rv-photo-wrap">
      <span class="rv-badge">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m5 12.5 4.5 4.5L19 7.5"></path>
        </svg>
        Đã xác thực
      </span>
      <img id="rvImg" src="" alt="">
      <span class="rv-name" id="rvName"></span>
    </div>
    <div class="rv-photos-grid" id="rvPhotosGrid"></div>
    <div class="rv-body">
      <div class="rv-divider" id="rvDivider"></div>
      <div id="rvMessage"></div>
    </div>
    <button class="btn ghost" type="button" id="lockBtnValid">Khóa lại</button>
  </section>

  <!-- ===================== KẾT QUẢ B: KHÔNG CÓ TRONG DANH SÁCH (kiểu chung) ===================== -->

    <h1>VÀO ĐÂY LÀM CÁI GÌ, HÓNG HỚT !</h1>

    loiNhan: [
      'Con lợn ULIS đất tổ ong, m rất là láo toét. Gì mà thích tôi mãi mãi, t sai thì phải bảo cho t sửa chứ, thg rắm.',
      'Lúc mới quen Hưng tôi hạnh phúc lắm, lần đầu tôi biết thế nào là yêu, tôi còn mơ cả tương lai nhiều lắm, cũng là lần đầu tôi hiểu cảm giác khóc vì thất tình là thế nào.',
      'Gương vỡ thì dù có sửa thì bản chất vẫn là vỡ. Tình cảm cũng vậy thôi, không thể so sánh với lúc đầu được. Chị tôi bảo là yêu thì chỉ một người thôi, tôi cũng nghĩ vậy, tôi chỉ chia tay khi họ làm gì có lỗi với mình thôi, nên Hưng đừng nghĩ là tôi lăng nhăng nhé.',
      'Không biết cái avatar kia có phải Hưng đang hỏi tôi không, nhưng nếu hỏi tôi thì tôi có. Hưng mà xem được cái này thì nhắn tôi nhá. Còn nếu Hưng có người khác hoặc hết tình cảm với tôi rồi thì đừng nhắn nhé ❤️.'
    ]

    loiNhan: [

      'Đúng thật T ạ, lên đại học tôi cũng thấy mình khác nhiều quá, lười biếng, nằm dài cả ngày, nhiều lúc tôi cũng sợ lắm rồi khóc rất nhiều. Nhưng khi lấy T bảo sợ vì lo điểm thấp tôi cũng chỉ biết an ủi thôi, tại mình cũng không có gì để giúp được T ngoài mấy lời động viên như vậy.',
      'Không biết T có từng yêu tôi không, hay chỉ đơn giản là muốn quan hệ thôi. Nhưng tôi thì có, tôi rất yêu T, yêu nhiều lắm.',
      'Tôi biết T ít khi vào xem fb của người khác, nên tôi để nó ở đây nhé. Khả năng cao là lúc T đọc được cái này chắc tôi đã không còn tình cảm với T nữa rồi. Dù sao thì tôi cũng cảm ơn T nhiều nhé.'

/* ==========================================================================
   PHẦN XỬ LÝ — bình thường bạn không cần sửa gì từ đây trở xuống
   ========================================================================== */
const root   = document.documentElement;
const card   = document.getElementById('card');
const step1  = document.getElementById('step1');
const step2  = document.getElementById('step2');
const resultValid   = document.getElementById('resultValid');
const resultInvalid = document.getElementById('resultInvalid');

const form1 = document.getElementById('form1');
const form2 = document.getElementById('form2');
const pass1 = document.getElementById('pass1');
const pass2 = document.getElementById('pass2');
const err1  = document.getElementById('err1');
const err2  = document.getElementById('err2');
const err1Text = document.getElementById('err1Text');
const err2Text = document.getElementById('err2Text');
const truong   = document.getElementById('truong');

truong.addEventListener('change', () => err2.classList.remove('show'));

// chỉ cho gõ chữ số
[pass1, pass2].forEach(inp => {
  inp.addEventListener('input', () => {
    inp.value = inp.value.replace(/\D/g, '');
    err1.classList.remove('show');
    err2.classList.remove('show');
  });
});

/* ---------- LỚP 1: sai mật khẩu thì tuyệt đối không sang được bước 2 ---------- */
form1.addEventListener('submit', e => {
  e.preventDefault();
  if (pass1.value.trim() === MAT_KHAU_LOP_1) {
    step1.classList.add('hidden');
    step2.classList.remove('hidden');   // chỉ khi đúng mới lộ ra bước 2
    pass2.focus();
  } else {
    baoLoi(err1, err1Text, 'Mật khẩu chưa đúng. Hãy nhập đủ 8 chữ số ngày sinh.');
    pass1.focus(); pass1.select();
  }
});

/* ---------- LỚP 2: phân nhánh theo ngày sinh ---------- */
form2.addEventListener('submit', e => {
  e.preventDefault();
  const ngaySinh = pass2.value.trim();

  if (ngaySinh.length !== 8) {
    baoLoi(err2, err2Text, 'Ngày sinh phải gồm đúng 8 chữ số, ví dụ 01012000.');
    pass2.focus();
    return;
  }

  if (!truong.value) {
    baoLoi(err2, err2Text, 'Vui lòng chọn trường bạn đang học.');
    truong.focus();
    return;
  }

  const nguoi = DANH_SACH[ngaySinh];

  // nếu người này có khai báo "truong" thì trường được chọn phải khớp,
  // sai trường dù đúng ngày sinh vẫn coi là không hợp lệ
  const truongKhop = !nguoi || !nguoi.truong || nguoi.truong === truong.value;

  if (nguoi && truongKhop) {
    hienKetQuaHopLe(nguoi);
  } else {
    hienKetQuaKhongHopLe();
  }
});

/* ---------- Kết quả A: người có trong danh sách — mỗi người 1 kiểu ---------- */
function hienKetQuaHopLe(nguoi) {
  // đổi màu chủ đề riêng cho người này (nếu có khai báo "mau")
  if (nguoi.mau) {
    root.style.setProperty('--theme', nguoi.mau);
    root.style.setProperty('--theme-2', nguoi.mau);
    root.style.setProperty('--theme-soft', nguoi.mau + '22');
  }

  const laKieuDon = nguoi.kieu === 'don';
  resultValid.classList.toggle('kieu-don', laKieuDon);

  const rvImg = document.getElementById('rvImg');
  const rvName = document.getElementById('rvName');
  const rvDivider = document.getElementById('rvDivider');
  const rvPhotosGrid = document.getElementById('rvPhotosGrid');

  if (laKieuDon) {
    // kiểu 'don': lưới nhiều ảnh, không tên, không huy hiệu, không đường kẻ
    rvImg.src = '';
    rvName.textContent = '';
    rvDivider.style.display = 'none';
    rvPhotosGrid.innerHTML = '';
    (nguoi.anhList || []).forEach(src => {
      const img = document.createElement('img');
      img.src = src;
      img.alt = '';
      rvPhotosGrid.appendChild(img);
    });
  } else {
    // kiểu 'hero' (mặc định): một ảnh lớn, tên đè lên ảnh
    rvDivider.style.display = '';
    rvImg.src = nguoi.anh || '';
    rvImg.alt = nguoi.ten || '';
    rvName.textContent = nguoi.ten || '';
    rvPhotosGrid.innerHTML = '';
  }

  const body = document.getElementById('rvMessage');
  body.innerHTML = '';
  // mỗi phần tử trong loiNhan có thể là:
  //  - một chuỗi văn bản  -> hiện thành 1 đoạn văn
  //  - { anh: 'data:...' } -> hiện thành 1 ảnh chèn giữa nội dung
  (nguoi.loiNhan || []).forEach(doan => {
    if (doan && typeof doan === 'object' && doan.anh) {
      const img = document.createElement('img');
      img.src = doan.anh;
      img.alt = '';
      img.className = 'rv-inline-img';
      body.appendChild(img);
    } else {
      const p = document.createElement('p');
      p.textContent = doan;
      body.appendChild(p);
    }
  });

  step2.classList.add('hidden');
  resultValid.classList.remove('hidden');
  card.classList.add('wide');
}

/* ---------- Kết quả B: không có trong danh sách — kiểu chung, cố định ---------- */
function hienKetQuaKhongHopLe() {
  step2.classList.add('hidden');
  resultInvalid.classList.remove('hidden');
  card.classList.add('wide');
}

/* ---------- Báo lỗi + rung nhẹ ---------- */
function baoLoi(hopLoi, oChu, noiDung) {
  oChu.textContent = noiDung;
  hopLoi.classList.add('show');
  card.classList.remove('shake');
  void card.offsetWidth;
  card.classList.add('shake');
  card.style.borderColor = 'var(--danger)';
  setTimeout(() => { card.style.borderColor = ''; }, 700);
}

/* ---------- Quay lại từ đầu ---------- */
document.getElementById('backBtn').addEventListener('click', quayVeDau);
document.getElementById('lockBtnValid').addEventListener('click', quayVeDau);
document.getElementById('lockBtnInvalid').addEventListener('click', quayVeDau);

function quayVeDau() {
  pass1.value = ''; pass2.value = ''; truong.value = '';
  err1.classList.remove('show'); err2.classList.remove('show');
  resultValid.classList.add('hidden');
  resultValid.classList.remove('kieu-don');
  resultInvalid.classList.add('hidden');
  step2.classList.add('hidden');
  step1.classList.remove('hidden');
  card.classList.remove('wide');
  root.style.removeProperty('--theme');
  root.style.removeProperty('--theme-2');
  root.style.removeProperty('--theme-soft');
  pass1.focus();
}

window.addEventListener('load', () => pass1.focus());
</script>
